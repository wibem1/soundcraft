name: AI Studio Native Chat
on:
  push:
    branches: [ai-studio/dev]
  pull_request:
    branches: [ai-studio/dev]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ai-studio-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-headless:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - name: Linux build and offscreen rendering dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev mesa-vulkan-drivers pkg-config
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p soundcraft-ai-studio -p soundcraft-ui-egui --all-targets --locked -- -D warnings
      - run: cargo test -p soundcraft-ai-studio -p soundcraft-automation --locked
      - run: cargo test -p soundcraft-ui-egui --lib ai_chat --locked
      - run: cargo test -p soundcraft-ui-egui --test ai_studio --test commands_filter --test command_reachability --locked
      - run: cargo build -p soundcraft --locked
      - name: Reduce native binary size
        if: runner.os != 'Windows'
        run: strip target/debug/soundcraft
      - run: cargo xtask layers
      - run: cargo xtask assets
      - name: Run isolated workflow and capture diagnosis
        shell: bash
        run: cargo run --locked -p soundcraft-ai-studio -- self-test > ai-studio-diagnostics.json
      - name: Render the actual panel
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo run --locked -p soundcraft-ui-egui --example ui_shot -- ai-studio-panel.png docs/ai-studio/panel-smoke.jsonl --size 1400x900
          test -s ai-studio-panel.png
      - name: Prepare runnable package
        shell: bash
        run: |
          mkdir -p ai-studio-package
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/debug/soundcraft.exe ai-studio-package/SoundCraft-AI-Studio.exe
          else
            cp target/debug/soundcraft ai-studio-package/SoundCraft-AI-Studio
          fi
          cp docs/ai-studio/START.md ai-studio-package/START.md
          cp ai-studio-diagnostics.json ai-studio-package/ai-studio-diagnostics.json
      - uses: actions/upload-artifact@v4
        with:
          name: ai-studio-chat-${{ matrix.os }}-${{ github.sha }}
          path: |
            ai-studio-package/*
            ai-studio-panel.png
